<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>게시판 연동 테스트</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 720px; margin: 30px auto; line-height: 1.5; color: #333; }
        section { border: 1px solid #e1e4e8; padding: 18px; margin-bottom: 20px; border-radius: 8px; background: #fff; }
        input, textarea, button { display: block; margin: 8px 0; width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #ccc; border-radius: 6px; }
        button { cursor: pointer; background: #0066cc; color: white; border: none; font-weight: bold; }
        .post-card { border: 1px solid #e1e4e8; border-radius: 6px; padding: 15px; margin-bottom: 15px; }
        .comment-box { background: #f6f8fa; padding: 12px; margin-top: 10px; border-radius: 6px; }
        .comment-item { font-size: 13px; margin: 5px 0; border-bottom: 1px solid #eaecef; padding-bottom: 4px; }
    </style>
</head>
<body>
<h1>게시판 연동 테스트</h1>

<section>
    <h2>로그인 / 세션 관리</h2>
    <div id="login-form">
        <input type="text" id="username" placeholder="아이디" value="testuser">
        <input type="password" id="password" placeholder="비밀번호" value="password123">
        <button type="button" onclick="login()">로그인</button>
    </div>
    <div id="user-info" style="display: none;">
        <p><strong>접속 계정:</strong> <span id="current-user"></span></p>
        <button type="button" style="background: #6c757d;" onclick="logout()">로그아웃</button>
    </div>
</section>

<section>
    <h2>게시글 작성</h2>
    <input type="text" id="post-title" placeholder="글 제목">
    <textarea id="post-content" rows="3" placeholder="내용을 입력하세요"></textarea>
    <button type="button" onclick="createPost()">게시글 등록</button>
</section>

<section>
    <h2>게시글 목록</h2>
    <button type="button" style="background: #28a745;" onclick="loadPosts()">목록 새로고침</button>
    <div id="post-list" style="margin-top: 15px;"></div>
</section>

<script>
    window.onload = function() {
        checkAuth();
        loadPosts();
    };

    async function checkAuth() {
        try {
            const res = await fetch('/api/users/me');
            if (res.ok) {
                const data = await res.json();
                document.getElementById('login-form').style.display = 'none';
                document.getElementById('user-info').style.display = 'block';
                document.getElementById('current-user').innerText = `${data.nickname} (${data.username})`;
            } else {
                document.getElementById('login-form').style.display = 'block';
                document.getElementById('user-info').style.display = 'none';
            }
        } catch (e) {
            console.error(e);
        }
    }

    async function login() {
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        const res = await fetch('/api/users/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });

        if (res.ok) {
            alert('로그인 성공');
            checkAuth();
            loadPosts();
        } else {
            alert('로그인 실패');
        }
    }

    async function logout() {
        await fetch('/api/users/logout', { method: 'POST' });
        alert('로그아웃 완료');
        checkAuth();
        loadPosts();
    }

    async function createPost() {
        const title = document.getElementById('post-title').value.trim();
        const content = document.getElementById('post-content').value.trim();

        const res = await fetch('/api/posts', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title, content })
        });

        if (res.ok) {
            document.getElementById('post-title').value = '';
            document.getElementById('post-content').value = '';
            loadPosts();
        } else {
            const err = await res.text();
            alert('글 작성 실패: ' + err);
        }
    }

    async function loadPosts() {
        const res = await fetch('/api/posts');
        const posts = await res.json();
        const listEl = document.getElementById('post-list');
        listEl.innerHTML = '';

        posts.forEach(post => {
            const card = document.createElement('div');
            card.className = 'post-card';
            card.innerHTML = `
                    <h3>${post.title} <small style="color: #666; font-size: 13px; font-weight: normal;">작성자: ${post.author}</small></h3>
                    <p>${post.content}</p>
                    <div class="comment-box">
                        <strong>댓글 목록</strong>
                        <div id="comments-${post.id}" style="margin: 8px 0;"></div>
                        <input type="text" id="comment-input-${post.id}" placeholder="댓글 입력...">
                        <button type="button" style="padding: 8px; font-size: 13px;" onclick="handleCommentClick(${post.id})">댓글 등록</button>
                    </div>
                `;
            listEl.appendChild(card);
            loadComments(post.id);
        });
    }

    async function loadComments(postId) {
        const res = await fetch(`/api/posts/${postId}/comments`);
        const comments = await res.json();
        const box = document.getElementById(`comments-${postId}`);

        if (!comments || comments.length === 0) {
            box.innerHTML = '<p style="color: #888; font-size: 13px; margin: 4px 0;">댓글이 없습니다.</p>';
            return;
        }

        box.innerHTML = comments.map(c =>
            `<div class="comment-item"><strong>${c.author}:</strong> ${c.content}</div>`
        ).join('');
    }

    // 디버깅 팝업을 포함한 댓글 등록 함수
    async function handleCommentClick(postId) {
        const input = document.getElementById(`comment-input-${postId}`);
        const content = input.value.trim();

        if (!content) {
            alert('댓글 내용을 입력해 주세요.');
            return;
        }

        try {
            const res = await fetch(`/api/posts/${postId}/comments`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content: content })
            });

            if (res.ok) {
                input.value = '';
                loadComments(postId);
            } else {
                const errorText = await res.text();
                alert(`서버 응답 에러 (${res.status}): ${errorText}`);
            }
        } catch (err) {
            alert('요청 에러: ' + err.message);
        }
    }
</script>
</body>
</html>
